# alembic.ini

[alembic]
# script_location: WHERE the alembic/ folder lives.
# %(here)s = the directory containing alembic.ini (the project root).
script_location = %(here)s/alembic

# sqlalchemy.url: The DATABASE connection string Alembic uses.
# We use the SYNC driver (psycopg2) because Alembic itself is synchronous.
# This value is OVERRIDDEN by env.py (reads from .env via Settings).
sqlalchemy.url = postgresql+psycopg2://postgres:password@localhost:5432/docdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S